name = "tiresias-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tiresias-db"
database_id = "8c21f6d8-c670-4767-8a95-9e4144e28036"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tiresias-files"

[ai]
binding = "AI"

[vars]
SIMULATION_API = "https://api.tiresiasview.com"
RESEND_FROM_EMAIL = "login@tiresiasview.com"
RESEND_FROM_NAME = "Tiresias View"
AUTH_SIGNUP_VERIFICATION_TTL_HOURS = "24"
AUTH_BASE_URL = "https://tiresiasview.com"
SUPPORT_EMAIL = "support@tiresiasview.com"
